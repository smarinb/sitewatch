<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 830" width="1320" height="830" role="img" aria-labelledby="t d" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title id="t">Sitewatch architecture</title>
<desc id="d">A visitor's browser loads a React panel from Cloudflare Pages and calls the API through Cloudflare and Caddy on one small EC2 instance. The Spring Boot API stores data in PostgreSQL, checks monitored sites on a schedule, and sends alerts by Telegram and SES. Grafana Alloy ships its metrics to Grafana Cloud, PostgreSQL is dumped nightly to S3, and GitHub Actions tests, builds and deploys through SSM.</desc>
