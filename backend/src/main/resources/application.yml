spring:
  application:
    name: sitewatch
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/sitewatch}
    username: ${DB_USER:sitewatch}
    password: ${DB_PASSWORD:sitewatch}
    hikari:
      maximum-pool-size: 5
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  # SMTP comes from SPRING_MAIL_HOST / _PORT / _USERNAME / _PASSWORD. Without a host,
  # no mail sender is created and the email channel stays off.
  mail:
    properties:
      mail.smtp.starttls.enable: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000

server:
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

sitewatch:
  jwt:
    # Base64 HMAC key, at least 32 bytes: openssl rand -base64 32
    secret: ${JWT_SECRET}
    ttl: ${JWT_TTL:PT24H}
    issuer: sitewatch
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  checker:
    enabled: ${CHECKER_ENABLED:true}
    tick: 30s
    batch-size: 100
    max-concurrent: 8
    connect-timeout: 5s
    response-timeout: 10s
    max-body-bytes: 512KB
    user-agent: "SitewatchBot/1.0 (+https://monitor.sergiomarin.dev)"
    allow-private-addresses: false
  alerts:
    failure-threshold: 2
    ssl-warning: 14d
    mail-from: ${MAIL_FROM:Sitewatch <alerts@monitor.sergiomarin.dev>}
    telegram:
      bot-token: ${TELEGRAM_BOT_TOKEN:}
      api-url: https://api.telegram.org
