# Local development: PostgreSQL + API. Frontend runs with `npm run dev`.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: sitewatch
      POSTGRES_USER: sitewatch
      POSTGRES_PASSWORD: sitewatch
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sitewatch"]
      interval: 5s
      retries: 10

  api:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://db:5432/sitewatch
      DB_USER: sitewatch
      DB_PASSWORD: sitewatch
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env (see .env.example)}
      SPRING_MAIL_HOST: mailpit
      SPRING_MAIL_PORT: 1025
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
    ports: ["8080:8080"]
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started

  # Catches every email sent in development. Web UI: http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.28.0
    ports: ["1025:1025", "8025:8025"]

volumes:
  pgdata:
