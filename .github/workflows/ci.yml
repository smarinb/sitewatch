name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build and test (Testcontainers uses the runner's Docker)
        run: ./mvnw -B verify

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  infra:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false
      - run: terraform validate

  deploy-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck the deploy script
        run: shellcheck -S style deploy/deploy.sh
      - name: Validate the production compose file
        run: IMAGE_TAG=ci DB_PASSWORD=ci docker compose -f deploy/docker-compose.prod.yml config -q
      - name: Reject malformed arguments before touching anything
        run: |
          for args in "abc tag" "0000000000000000000000000000000000000000 ../etc" "0000000000000000000000000000000000000000 a;rm"; do
            if bash deploy/deploy.sh $args; then echo "accepted: $args"; exit 1; fi
          done
